name: Learning site

# Builds the VitePress site in site/ together with the Doxygen API reference and
# publishes it to GitHub Pages. In the repo settings, set Pages > Source to
# "GitHub Actions". The API output is generated here and never committed.

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'docs/tutorials/**'
      - 'docs/doxygen/**'
      - '.github/workflows/site_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
        working-directory: .
      - run: npm ci
      - name: Generate the API reference
        run: npm run api
      - name: Build the site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
